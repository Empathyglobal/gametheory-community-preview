name: Verify community source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source privacy and syntax
        run: node tests/verify-candidate.cjs
      - name: Exercise all seven game models
        run: node tests/engine-smoke.cjs
