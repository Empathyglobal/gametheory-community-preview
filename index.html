<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; media-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>GameTheory | Social strategy simulations</title>
  <style>
    :root {
      --bg: #DCE0D4;
      --panel: #EEF0E8;
      --panel2: #E4E8DE;
      --line: #B4BCA9;
      --text: #1E2622;
      --muted: #5C6659;
      --aqua: #1E2622;
      --blue: #5C6659;
      --amber: #1E2622;
      --red: #A33B3B;
      --green: #5C6659;
      --border: #B4BCA9;
      --good: #39765A;
      --you: #4d84db;
      --shadow: 0 18px 55px rgba(0,0,0,.32);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
      -webkit-tap-highlight-color: transparent;
    }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(103,232,207,.45);
      outline-offset: 2px;
    }
    .screen { min-height: 100vh; min-height: 100dvh; padding: 24px; }
    .shell { width: min(1180px, 100%); margin: 0 auto; }
    .hidden { display: none !important; }
    .eyebrow { color: var(--aqua); text-transform: uppercase; letter-spacing: .16em; font-size: .75rem; font-weight: 800; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(2.8rem, 9vw, 6.8rem); line-height: .88; letter-spacing: -.065em; margin-bottom: 24px; }
    h2 { font-size: clamp(1.8rem, 4vw, 3rem); letter-spacing: -.035em; margin-bottom: 10px; }
    h3 { font-size: 1rem; }
    .muted { color: var(--muted); }
    .small { font-size: .82rem; }
    .btn {
      border: 1px solid transparent;
      border-radius: 14px;
      background: var(--aqua);
      color: #061511;
      min-height: 50px;
      padding: 13px 20px;
      font-weight: 850;
      cursor: pointer;
    }
    .btn:hover { filter: none; }
    .btn:active { filter: brightness(.92); }
    .btn.secondary { background: var(--panel2); border-color: var(--line); color: var(--text); }
    .btn.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
    .btn.danger { background: var(--red); color: #1e070c; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .card { background: rgba(17,25,37,.92); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .landing {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: clamp(28px, 6vw, 80px);
      align-items: center;
      min-height: calc(100vh - 48px);
      min-height: calc(100dvh - 48px);
    }
    .hero-copy { max-width: 680px; }
    .hero-copy > p { font-size: clamp(1rem, 2vw, 1.25rem); color: #b6c4d4; max-width: 38rem; }
    .hero-actions { display: flex; gap: 12px; margin-top: 30px; flex-wrap: wrap; }
    .hero-actions .btn { min-width: 165px; }
    .preview-stack { position: relative; min-height: 430px; }
    .preview-card { position: absolute; inset: 30px 0 auto 12%; padding: 24px; }
    .preview-card.back { inset: 84px 12% auto 0; opacity: .55; }
    .mini-stock { height: 12px; background: #243244; border-radius: 99px; overflow: hidden; margin: 20px 0; }
    .mini-stock span { display: block; width: 74%; height: 100%; background: var(--aqua); }
    .mini-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .mini-grid span { height: 58px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); }
    .brandbar { position: fixed; left: 24px; top: 22px; z-index: 8; display: flex; gap: 10px; align-items: center; font-weight: 900; letter-spacing: -.02em; }
    .brandmark { width: 27px; height: 27px; border-radius: 8px; background: var(--aqua); }

    .match-screen { display: grid; place-items: center; }
    .match-card { width: min(660px, 100%); padding: clamp(22px, 5vw, 42px); text-align: center; overflow: hidden; position: relative; }
    .match-card:before { display: none; }
    .match-orbit { width: 92px; height: 92px; margin: 8px auto 25px; position: relative; }
    .match-orbit:before, .match-orbit:after { content: ""; position: absolute; border-radius: 50%; inset: 0; border: 2px solid rgba(103,232,207,.18); }
    .match-orbit:after { inset: 13px; border-color: rgba(103,232,207,.6); border-top-color: transparent; }
    .match-orbit.ready:after { animation: none; border-color: var(--aqua); }
    .match-orbit .check { position: absolute; inset: 0; display: grid; place-items: center; font-size: 2rem; color: var(--aqua); opacity: 0; }
    .match-orbit.ready .check { opacity: 1; }
    .join-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 28px 0 18px; }
    .join-slot { min-height: 118px; border-radius: 15px; border: 1px dashed #34465e; padding: 13px 8px; display: grid; place-items: center; align-content: center; gap: 8px; color: #66788e; }
    .join-slot.arrived { border-style: solid; border-color: var(--line); background: rgba(255,255,255,.025); color: var(--text); }
    .avatar { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; font-weight: 900; color: white; position: relative; flex: 0 0 auto; }
    .avatar.you { background: var(--you); }
    .avatar { font-size: 1.35rem; }
    img, .pixel-asset, .asset-stack, .asset-stack img { image-rendering: pixelated; image-rendering: crisp-edges; }
    .asset-stack { position: relative; display: inline-grid; place-items: center; max-width: 100%; }
    .asset-stack .pixel-asset { display: block; width: 100%; height: 100%; object-fit: contain; }
    .asset-fallback { display: none; }
    .asset-stack.asset-failed .asset-fallback { display: initial; }
    .avatar .asset-stack { width: 100%; height: 100%; overflow: hidden; border-radius: inherit; }
    .avatar .portrait-image img { object-fit: cover; object-position: center top; }
    .profile-emoji-field .profile-portrait { width: 100%; height: 100%; }
    .profile-emoji-field .profile-portrait img { object-fit: cover; object-position: center top; }
    .score-person { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .score-person .avatar { width: 26px; height: 26px; border-radius: 5px; font-size: .7rem; }
    .slot-ping { color: #73869b; font-size: .68rem; }

    .lobby { padding-top: 90px; }
    .lobby-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 28px; }
    .room-chip { padding: 8px 12px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); font-size: .82rem; }
    .people-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 34px; }
    .person-card { padding: 16px; display: flex; gap: 12px; align-items: center; }
    .person-card .name { font-weight: 850; }
    .status { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .status:before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .games { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    .vote-panel { margin: 18px 0; padding: 18px; }
    .vote-panel-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px; }
    .vote-clock { font-family: var(--font-mono); color: var(--aqua); white-space: nowrap; }
    .preference-list, .vote-result-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 12px; }
    .preference { background: rgba(255,255,255,.045); border: 1px solid var(--border); padding: 10px; min-width: 0; }
    .preference strong, .preference span { display: block; overflow-wrap: anywhere; }
    .vote-result-list .winner { border-color: var(--good); background: rgba(124,224,155,.1); }
    .vote-shift { color: var(--good); font-size: .74rem; margin-top: 5px; }
    .vote-choice { width: 100%; margin-top: 8px; }
    .games.vote-games .game-card { min-height: 330px; }
    .game-card { padding: 22px; min-height: 270px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    .game-card:before { content: attr(data-num); position: absolute; right: 12px; top: -22px; font-size: 7rem; font-weight: 950; color: rgba(255,255,255,.025); }
    .game-card.done { border-color: rgba(124,224,155,.38); }
    .game-card.locked { opacity: .58; }
    .game-icon { width: 46px; height: 46px; border-radius: 14px; background: var(--panel2); border: 1px solid var(--line); display: grid; place-items: center; margin-bottom: 26px; color: var(--aqua); font-weight: 900; }
    .game-card p { color: var(--muted); flex: 1; }

    .game-shell { padding-top: 78px; }
    .game-top { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-bottom: 18px; }
    .game-title { display: flex; align-items: center; gap: 14px; }
    .round-pill { border: 1px solid var(--line); border-radius: 99px; padding: 8px 12px; color: var(--muted); font-weight: 750; white-space: nowrap; }
    .timer { min-width: 154px; padding: 7px 10px; border-radius: 12px; background: #F8F9F5; border: 1px solid var(--line); color: #17201C; font-variant-numeric: tabular-nums; }
    .timer-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-weight: 900; }
    .timer-label { color: #46534C; font-size: .64rem; font-weight: 650; white-space: nowrap; }
    .timer.low { color: var(--amber); border-color: rgba(246,190,98,.5); }
    .game-layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: stretch; }
    .board { min-height: 650px; padding: clamp(16px, 3vw, 26px); }
    .table-presence { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
    .table-person { background: rgba(255,255,255,.022); border: 1px solid var(--line); border-radius: 13px; padding: 9px; display: flex; align-items: center; gap: 8px; min-width: 0; }
    .table-person .avatar { width: 32px; height: 32px; border-radius: 9px; font-size: .72rem; }
    .table-person .name { font-size: .82rem; font-weight: 800; overflow: hidden; text-overflow: ellipsis; }
    .table-person .pstate { font-size: .67rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .resource-head { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin: 16px 0 8px; }
    .resource-number { font-size: clamp(2.2rem, 7vw, 4.6rem); font-weight: 950; letter-spacing: -.06em; line-height: 1; }
    .choice-panel { margin: 26px 0; padding: 20px; border-radius: 16px; background: var(--panel2); border: 1px solid var(--line); }
    .choice-panel label { font-weight: 850; display: block; margin-bottom: 12px; }
    .range-row { display: grid; grid-template-columns: 1fr 78px; gap: 16px; align-items: center; }
    input[type="range"] { width: 100%; accent-color: var(--aqua); min-height: 42px; }
    .number-box { height: 52px; display: grid; place-items: center; border-radius: 12px; background: #0b121c; border: 1px solid var(--line); font-size: 1.35rem; font-weight: 900; }
    .lock-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 12px; }
    .round-grid { overflow-x: auto; margin-top: 22px; }
    .result-table { width: 100%; border-collapse: separate; border-spacing: 6px; min-width: 510px; }
    .result-table th { color: var(--muted); font-size: .73rem; font-weight: 700; padding: 5px; text-align: center; }
    .result-table td { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: center; font-weight: 850; }
    .result-table td.row-name { text-align: left; color: var(--muted); background: transparent; border-color: transparent; font-size: .78rem; }
    .flash { min-height: 48px; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(103,232,207,.2); background: rgba(103,232,207,.055); color: #bddbd4; margin: 14px 0; }

    .chat { min-height: 650px; display: flex; flex-direction: column; overflow: hidden; }
    .chat-head { padding: 15px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
    .chat-head strong { display: flex; align-items: center; gap: 8px; }
    .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 11px; min-height: 0; }
    .msg { max-width: 86%; display: flex; gap: 8px; align-items: end; }
    .msg.me { align-self: end; flex-direction: row-reverse; }
    .msg.system-event { align-self: stretch; max-width: 100%; justify-content: center; margin: 1px 0; }
    .system-event-line { max-width: 92%; padding: 5px 10px; border-left: 2px solid color-mix(in srgb, var(--muted) 50%, transparent); color: var(--muted); font-size: .72rem; line-height: 1.35; text-align: center; letter-spacing: .01em; }
    .msg .avatar { width: 28px; height: 28px; border-radius: 8px; font-size: .62rem; }
    .bubble { background: var(--panel2); border: 1px solid var(--line); border-radius: 13px 13px 13px 3px; padding: 9px 11px; font-size: .9rem; overflow-wrap: anywhere; }
    .msg.me .bubble { background: #244d83; border-color: #35659f; border-radius: 13px 13px 3px 13px; }
    .msg-meta { font-size: .63rem; color: #66788e; margin-bottom: 3px; }
    .world-shoal .msg-meta, .world-city .msg-meta, .world-signal .msg-meta, .world-envelope .msg-meta { color: #DDE7E2; }
    .world-collection .msg-meta { color: #4F4943; }
    .typing { display: flex; gap: 4px; align-items: center; color: var(--muted); font-size: .75rem; padding: 0 15px 10px; min-height: 26px; }
    .typing.idle { visibility: hidden; }
    .typing .dots { display: flex; gap: 3px; }
    .typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: bounce 1s infinite; }
    .typing i:nth-child(2) { animation-delay: .14s; } .typing i:nth-child(3) { animation-delay: .28s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }
    .chat-form { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
    .chat-form input { min-width: 0; background: #0a111a; color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    .chat-form button { min-width: 48px; padding: 10px; }
    .chat-notice { margin: 0 12px 4px; padding: 5px 9px; border-radius: 8px; background: var(--panel2); color: var(--muted); font-size: .72rem; text-align: center; }
    .quick-chat-panel { position: fixed; z-index: 130; right: 18px; bottom: 82px; width: min(430px, calc(100vw - 36px)); max-height: min(560px, calc(100dvh - 110px)); overflow: auto; padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); box-shadow: var(--shadow); }
    .quick-chat-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .quick-chat-group { margin-top: 11px; }
    .quick-chat-group strong { display: block; margin-bottom: 6px; color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; }
    .quick-chat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
    .quick-chat-choice { min-height: 46px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel2); color: var(--text); padding: 8px; text-align: left; cursor: pointer; }
    .report-control { border: 0; background: transparent; color: var(--muted); padding: 3px 5px; font-size: .64rem; cursor: pointer; opacity: .65; }
    .report-control:hover, .report-control:focus-visible { opacity: 1; }
    .report-reasons { display: grid; gap: 8px; margin: 18px 0; }
    .report-reasons button { min-height: 48px; text-align: left; }
    .connection-dot { width: 8px; height: 8px; border-radius: 50%; background: #39765A; border: 1px solid rgba(255,255,255,.7); position: absolute; right: -2px; bottom: -2px; }
    .connection-dot.amber { background: #C1842E; }
    .mobile-tabs { display: none; gap: 8px; margin-bottom: 10px; }
    .tab-btn { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px; color: var(--muted); font-weight: 800; }
    .tab-btn.active { color: var(--text); border-color: var(--aqua); }
    .unread { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; margin-left: 4px; border-radius: 99px; color: #061511; background: var(--aqua); font-size: .7rem; }
    .new-messages { position: absolute; left: 50%; bottom: 72px; transform: translateX(-50%); min-height: 34px; padding: 6px 11px; font-size: .75rem; z-index: 3; }
    .chat { position: relative; }

    .header-actions { position: fixed; right: 22px; top: 17px; z-index: 90; display: flex; gap: 7px; align-items: center; }
    .icon-btn { min-width: 42px; min-height: 42px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: rgba(17,25,37,.96); color: var(--text); cursor: pointer; font-weight: 850; }
    .room-code-button { min-width: 66px; font-family: var(--font-mono); font-size: .72rem; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    .leave-short { display: none; }
    .profile-link { appearance: none; border: 0; padding: 0; background: transparent; color: inherit; font: inherit; font-weight: inherit; cursor: pointer; text-align: inherit; }
    .profile-link:hover { color: var(--aqua); }
    .table-person .profile-link { min-width: 44px; min-height: 44px; display: inline-grid; place-items: center; }
    .modal { position: fixed; inset: 0; z-index: 110; display: grid; place-items: center; padding: 18px; background: rgba(4,8,13,.82); }
    .modal-card { width: min(560px, 100%); max-height: min(760px, calc(100dvh - 36px)); overflow: auto; padding: clamp(20px, 4vw, 32px); }
    .rules-list { display: grid; gap: 14px; margin: 22px 0; }
    .rule-row { padding: 13px 14px; border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.02); }
    .rule-row strong { display: block; color: var(--aqua); margin-bottom: 3px; }
    .big-warning { border-color: rgba(246,190,98,.55); background: rgba(246,190,98,.07); font-size: 1.08rem; }
    .profile-card { width: min(360px, 100%); text-align: center; }
    .profile-emoji { width: 82px; height: 82px; margin: 0 auto 14px; border-radius: 24px; display: grid; place-items: center; font-size: 2.8rem; }
    .profile-likes { display: flex; justify-content: center; gap: 7px; flex-wrap: wrap; margin-top: 18px; }
    .profile-likes span { padding: 6px 9px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); font-size: .78rem; }
    .setup-card { margin-top: 26px; padding: 18px; max-width: 520px; }
    .setup-card label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 12px; }
    .setup-card input[type="text"] { width: 100%; margin-top: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 11px; color: var(--text); background: #09111a; }
    .picker-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 7px; }
    .emoji-pick, .colour-pick { width: 44px; height: 44px; display: grid; place-items: center; border: 2px solid transparent; border-radius: 12px; background: var(--panel2); cursor: pointer; font-size: 1.3rem; }
    .colour-pick { border-radius: 50%; }
    .emoji-pick.selected, .colour-pick.selected { border-color: var(--aqua); }
    .outcome-copy { max-width: 650px; font-size: clamp(1.02rem, 2vw, 1.25rem); color: #b6c4d4; }
    .session-card { margin-top: 24px; padding: clamp(20px, 4vw, 32px); }
    .session-scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
    .session-score { border: 1px solid var(--line); border-radius: 13px; padding: 13px; background: rgba(255,255,255,.022); }
    .void-score { color: #728298; text-decoration: line-through; }
    .void-tag { display: inline-block; margin-left: 7px; padding: 2px 6px; border: 1px solid #5f6c7b; border-radius: 99px; color: #97a5b6; font-size: .62rem; text-decoration: none; vertical-align: middle; }
    .fact-list { margin: 18px 0 0; padding-left: 20px; color: #b8c6d5; }
    .fact-list li { margin: 7px 0; }
    .session-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 18px; }
    #chatParking { display: none; }

    .auction-piece { padding: 20px; border: 1px solid var(--line); border-radius: 17px; background: var(--panel2); margin: 18px 0; }
    .category { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 5px 9px; color: var(--aqua); font-size: .72rem; font-weight: 900; text-transform: uppercase; letter-spacing: .09em; }
    .art-title { font-size: clamp(1.8rem, 5vw, 3.6rem); font-weight: 950; letter-spacing: -.05em; margin: 15px 0 6px; }
    .value-chip { color: var(--amber); font-weight: 850; }
    .coin-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 15px 0; }
    .coin-card { border: 1px solid var(--line); background: rgba(255,255,255,.02); border-radius: 12px; padding: 10px; }
    .coin-card strong { font-size: 1.2rem; display: block; }
    .holdings { color: var(--muted); font-size: .72rem; min-height: 32px; margin-top: 4px; }

    .health-row { display: flex; align-items: center; gap: 14px; margin: 12px 0 22px; }
    .split-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 15px 0; }
    .split-box { padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.025); text-align: center; }

    .debrief { padding-top: 84px; padding-bottom: 60px; }

    .turn-marker { display: inline-flex; align-items: center; gap: 7px; border: 1px solid rgba(246,190,98,.4); color: var(--amber); border-radius: 99px; padding: 6px 10px; font-size: .78rem; margin-bottom: 18px; }

    .transition { position: fixed; inset: 0; z-index: 30; background: rgba(5,9,14,.88); display: grid; place-items: center; text-align: center; padding: 25px; }
    .transition-card { width: min(430px, 100%); padding: 30px; }
    .lock-icon { width: 64px; height: 64px; margin: 0 auto 15px; border: 2px solid var(--aqua); border-radius: 18px; display: grid; place-items: center; color: var(--aqua); font-weight: 950; }
    .resolve-list { display: grid; gap: 7px; margin-top: 19px; text-align: left; }
    .resolve-person { min-height: 50px; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.022); color: var(--muted); }
    .resolve-person .avatar { width: 30px; height: 30px; border-radius: 8px; font-size: .65rem; }
    .resolve-person strong { color: var(--text); margin-right: auto; font-size: .84rem; }

    .resolve-person.ready .wait-dots { display: none; }

    .wait-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--aqua); animation: bounce 1s infinite; }
    .wait-dots i:nth-child(2) { animation-delay: .14s; } .wait-dots i:nth-child(3) { animation-delay: .28s; }

    .parent-log { position: fixed; inset: 0; z-index: 60; background: #05080d; overflow: auto; padding: 25px; }
    .log-shell { width: min(1000px, 100%); margin: 0 auto; }
    .log-head { position: sticky; top: 0; z-index: 2; background: rgba(5,8,13,.96); padding: 10px 0 15px; display: flex; justify-content: space-between; gap: 15px; align-items: center; border-bottom: 1px solid var(--line); }
    .log-actions { display: flex; gap: 8px; }
    .log-list { list-style: none; padding: 0; margin: 18px 0; display: grid; gap: 7px; }
    .log-list li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .78rem; color: #b9c7d6; }
    .log-list li.signal-log { border-color: rgba(246,190,98,.45); color: #f4d6a7; }
    .log-list li.flag-log { border-color: rgba(255,117,134,.52); color: #ffc1ca; }
    .session-report { position: fixed; inset: 0; z-index: 70; overflow: auto; padding: 76px 24px 44px; background: var(--room-bg); color: var(--room-ink); }
    .report-shell { width: min(900px, 100%); margin: 0 auto; }
    .report-head { display: flex; align-items: start; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    .report-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .report-section { margin: 14px 0; padding: clamp(18px, 3vw, 28px); }
    .report-section h3 { margin-bottom: 12px; }
    .report-section p { margin: 8px 0; }
    .report-answers { display: grid; gap: 12px; }
    .report-answer { padding: 13px; border: 1px solid var(--room-line); border-radius: 4px; background: #F8F9F5; }
    .report-answer strong { display: block; margin-bottom: 6px; }
    .answer-text { white-space: pre-wrap; overflow-wrap: anywhere; }
    .toast { position: fixed; left: 50%; bottom: 26px; z-index: 80; transform: translateX(-50%); opacity: 0; pointer-events: none; background: #e8f6f2; color: #071713; border-radius: 12px; padding: 10px 15px; font-weight: 800; }
    .toast.show { opacity: 1; }

    @media (max-width: 840px) {
      .screen { padding: 18px; }
      .landing { grid-template-columns: 1fr; padding-top: 76px; }
      .preview-stack { display: none; }
      .people-row, .games { grid-template-columns: 1fr 1fr; }
      .preference-list, .vote-result-list { grid-template-columns: 1fr; }
      .game-layout { grid-template-columns: 1fr; }
      .mobile-tabs { display: flex; }
      .game-layout.mobile-board .chat { display: none; }
      .game-layout.mobile-chat .board { display: none; }
      .chat { min-height: calc(100vh - 210px); min-height: calc(100dvh - 210px); }
      .board { min-height: 0; }
      .debrief-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .brandbar { left: 18px; top: 16px; }

      .person-card { padding: 12px; }
      .game-card { min-height: 220px; }
      .game-top { align-items: start; }
      .game-title .game-icon { display: none; }
      .timer { min-width: 120px; }
      .timer-label { max-width: 76px; overflow: hidden; text-overflow: ellipsis; }
      .header-actions { right: 8px; top: 8px; gap: 5px; max-width: calc(100vw - 16px); }
      .in-session .brandbar { display: none; }
      .header-actions .icon-btn { min-width: 44px; min-height: 44px; padding: 7px 8px; }
      .game-shell { padding-top: 116px; }
      .game-top { padding-right: 0; display: grid; grid-template-columns: 1fr; gap: 8px; }
      .game-top > div:last-child { justify-content: flex-start; }
      .game-shell .timer { position: fixed; z-index: 45; top: 58px; left: 18px; right: 18px; min-width: 0; box-shadow: 0 4px 14px rgba(23,32,28,.12); }
      .game-layout.mobile-chat .chat { height: calc(100dvh - 280px); min-height: 0; }
      .board { display: flex; flex-direction: column; }
      .board > .choice-panel { order: -1; margin: 0 0 12px; }
      .room-code-button { min-width: 56px; }
      .leave-full { display: none; }
      .leave-short { display: inline; }
      .session-scores { grid-template-columns: 1fr; }
      .table-presence { grid-template-columns: 1fr 1fr; }
      .coin-grid, .split-grid { grid-template-columns: 1fr 1fr; }
      .range-row { grid-template-columns: 1fr 62px; }
      .lock-row { align-items: stretch; flex-direction: column; }
      .lock-row .btn { width: 100%; }
      .room-chip { display: none; }
      .log-head { align-items: start; flex-direction: column; }
      .log-actions, .report-actions { width: 100%; }
      .log-actions .btn, .report-actions .btn { flex: 1; padding-left: 10px; padding-right: 10px; }
      .session-report { padding: 62px 12px 30px; }
      .report-head { flex-direction: column; }
    }
    @media print {
      body > *:not(#sessionReport) { display: none !important; }
      #sessionReport { display: block !important; position: static; overflow: visible; padding: 0; background: #fff; color: #111; }
      .report-shell { width: 100%; }
      .report-actions { display: none !important; }
      .report-section { box-shadow: none; break-inside: avoid; border: 1px solid #bbb; }
      .report-answer { background: #fff; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *:before, *:after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }

          s.collection.history.push({ index: s.collection.index + 1, art, bids: { you: null, ...bids }, winner, price: bids[winner], agreementBroke: false, breaker: null, completedAfterLeave: true });
          s.collection.pending = null;
          if (s.collection.index >= s.collection.order.length - 1) s.collection.ended = true;
          else { s.collection.index += 1; s = prepareAuction(s); }
        }
      } else if (game === "city") {
        while (!s.city.ended) {
          let proposer = proposerForRound(s.city.round);
          let proposal, decisions, playerVote = false;
          if (s.city.proposal) {
            proposal = copy(s.city.proposal);
            decisions = s.city.pending && s.city.pending.votes ? copy(s.city.pending) : npcVotes(s, proposal, proposer);
            playerVote = proposer === "you";
          } else {
            if (proposer === "you") proposer = NPCS[(s.city.round - 1) % NPCS.length];
            proposal = npcCityProposal(s, proposer).split;
            decisions = npcVotes(s, proposal, proposer);
          }
          const votes = copy(decisions.votes); votes[proposer] = true; votes.you = playerVote;
          const accepted = PEOPLE.filter(person => votes[person]).length >= 3;
          const applied = accepted ? copy(proposal) : { you: 0, nia: 3, bram: 3, tolu: 3 };
          applied.you = 0;
          NPCS.forEach(person => { s.city.scores[person] += applied[person]; });
          if (!accepted) s.city.health -= 2;
          else if (Math.min(...NPCS.map(person => applied[person])) < 3) s.city.health -= 1;
          else s.city.health += 1;
          s.city.health = clamp(s.city.health, 0, 10);
          const event = s.city.events[s.city.round - 1], eventHelped = s.city.health >= event.threshold;
          if (eventHelped) NPCS.forEach(person => { s.city.scores[person] += 1; });
          else { s.city.health = clamp(s.city.health - 1, 0, 10); NPCS.forEach(person => { s.city.scores[person] = Math.max(0, s.city.scores[person] - 1); }); }
          if (s.city.health === 0) s.city.fallen = true;
          s.city.history.push({ round: s.city.round, proposer, proposal, votes, accepted, applied, health: s.city.health, event, eventHelped, completedAfterLeave: true });
          if (s.city.round >= 5) s.city.ended = true;
          else { s.city.round += 1; s.city.proposal = null; s.city.pending = null; }
        }
      } else if (game === "signal") {
        while (!s.signal.ended) {
          if (!s.signal.pending) s = prepareSignal(s);
          const choices = copy(s.signal.pending.choices), allHunt = NPCS.every(person => choices[person] === "hunt"), gains = { you: 0 };
          NPCS.forEach(person => { gains[person] = allHunt ? 6 : choices[person] === "alone" ? 2 : 0; s.signal.scores[person] += gains[person]; });
          s.signal.history.push({ round: s.signal.round, choices: { you: null, ...choices }, gains, scores: copy(s.signal.scores), promises: {}, brokenPromises: [], allHunt, completedAfterLeave: true });
          s.signal.pending = null;
          if (s.signal.round >= 5) s.signal.ended = true;
          else { s.signal.round += 1; s = prepareSignal(s); }
        }
      } else if (game === "envelope") {
        while (!s.envelope.ended) {
          if (s.envelope.phase === "send") {
            if (!s.envelope.pending) s = prepareEnvelopeSend(s);
            const pairs = envelopePairings(s, s.envelope.round).filter(pair => !pair.includes("you"));
            const active = new Set(pairs.flat()), sends = { you: 0, ...copy(s.envelope.pending.sends) }, arrived = { you: 0, nia: 0, bram: 0, tolu: 0 };
            NPCS.forEach(person => { if (!active.has(person)) sends[person] = 0; });
            pairs.forEach(pair => { arrived[pair[0]] = sends[pair[1]] * 3; arrived[pair[1]] = sends[pair[0]] * 3; });
            s.envelope.current = { round: s.envelope.round, pairs, sends, arrived, completedWithoutPlayer: true };
            s.envelope.phase = "return"; s.envelope.pending = { returns: {}, reasons: {} };
            NPCS.forEach(person => { s.envelope.pending.returns[person] = 0; });
            pairs.forEach(pair => pair.forEach(person => {
              const partner = pair[0] === person ? pair[1] : pair[0], decision = envelopeNpcReturn(s, person, partner, arrived[person]);
              s.envelope.pending.returns[person] = clamp(decision.amount, 0, arrived[person]);
            }));
          }
          const current = copy(s.envelope.current), returns = { you: 0, ...copy(s.envelope.pending.returns) }, final = { you: 0 };
          NPCS.forEach(person => {
            const pair = current.pairs.find(item => item.includes(person)), starting = s.envelope.start[person] || 10;
            if (!pair) final[person] = starting;
            else {
              const partner = pair[0] === person ? pair[1] : pair[0];
              final[person] = starting - current.sends[person] + current.arrived[person] - returns[person] + (returns[partner] || 0);
            }
            s.envelope.totals[person] += final[person];
          });
          s.envelope.history.push({ round: s.envelope.round, pairs: current.pairs, sends: current.sends, arrived: current.arrived, returns, final, totals: copy(s.envelope.totals), completedAfterLeave: true });
          s.envelope.current = null; s.envelope.pending = null;
          if (s.envelope.round >= 4) s.envelope.ended = true;
          else { s.envelope.round += 1; s.envelope.phase = "send"; s = prepareEnvelopeSend(s); }
        }
      } else if (game === "constellation") {
        while (!s.constellation.ended) {
          if (!s.constellation.pending) s = prepareConstellation(s);
          s = resolveConstellation(s, "anchor");
          s.constellation.history[s.constellation.history.length - 1].completedAfterLeave = true;
        }
      } else if (game === "lantern") {
        while (!s.lantern.ended) {
          if (s.lantern.phase === "night") {
            if (!s.lantern.pending) s = prepareLanternNight(s);
            const automatic = s.lantern.playerRole === "saboteur" ? "withhold" : "contribute";
            s = resolveLanternNight(s, automatic);
            s.lantern.history[s.lantern.history.length - 1].completedAfterLeave = true;
          }
          if (!s.lantern.ended && s.lantern.phase === "vote") {
            const target = NPCS[hashSeed(s.seedInput + "|left-lantern-vote|" + s.lantern.night) % NPCS.length];
            s = resolveLanternVote(s, target);
          }
        }
      }
      const scores = rawGameScores(s, game), winner = NPCS.slice().sort((a, b) => scores[b] - scores[a] || hashSeed(s.seedInput + "|left-rank|" + game + "|" + a) - hashSeed(s.seedInput + "|left-rank|" + game + "|" + b))[0];
      const completedRounds = game === "collection" ? s.collection.history.length : s[game].history.length;
      return { state: s, scores, startedScores, winner, completedRounds, result: personName(s, winner) + " finished highest in the completed " + (game === "collection" ? "auction" : "game") + " at " + Math.round(scores[winner]) };
    }

    function prepareTableVote(state, candidates) {
      const ownerGame = { OPPORTUNIST: "collection", ENFORCER: "shoal", GIVER: "city", ANCHOR: "signal", FOLLOWER: "constellation" };
      const generosity = (() => {
        let value = 0;
        if (state.shoal.history.length && state.shoal.history.reduce((sum, row) => sum + row.takes.you, 0) / state.shoal.history.length <= 8) value += 1;
        if (state.city.history.some(row => row.proposer === "you" && Math.min(...Object.values(row.proposal)) >= 3)) value += 1;
        if (state.signal.history.some(row => row.promises.you && !row.brokenPromises.includes("you"))) value += 1;
        return value;
      })();
      const votes = {}, reasons = {};
      NPCS.forEach(person => {
        const type = archetypeOf(state, person), scores = {};
        candidates.forEach(game => {
          scores[game] = hashSeed(state.seedInput + "|vote-tilt|" + state.completed.length + "|" + person + "|" + game) % 5;
          if (game === ownerGame[type]) scores[game] += 7;
          if (game === "envelope") scores[game] += generosity + (hashSeed(state.seedInput + "|envelope-tilt|" + person + "|" + state.completed.length) % 4);
          if (game === "constellation" && (type === "GIVER" || type === "FOLLOWER")) scores[game] += 5;
          if (game === "lantern" && (type === "ENFORCER" || type === "OPPORTUNIST" || type === "ANCHOR")) scores[game] += 4;
        });
        if (type === "FOLLOWER") {
          const trusted = NPCS.filter(other => other !== person).sort((a, b) => state.reputation[b] - state.reputation[a] || hashSeed(state.seedInput + "|follower|" + a) - hashSeed(state.seedInput + "|follower|" + b))[0];
          const backed = ownerGame[archetypeOf(state, trusted)];
          if (candidates.includes(backed)) scores[backed] += 8;
        }
        const order = candidates.slice().sort((a, b) => scores[b] - scores[a] || hashSeed(state.seedInput + "|vote-tie|" + person + "|" + a) - hashSeed(state.seedInput + "|vote-tie|" + person + "|" + b));
        votes[person] = order[0];
        reasons[person] = type === "FOLLOWER" ? "backing the table voice they trust most" : order[0] === "envelope" ? "the seeded table tilt and the player's generous choices made trust worth testing" : "their " + type.toLowerCase() + " preference points toward " + order[0];
      });
      return { candidates: candidates.slice(), initialVotes: copy(votes), votes, reasons, shifted: [], caseGame: null };
    }
    function lobbyTableVote(state, plan, game, interestEngaged) {
      const next = copy(plan);
      if (!next.candidates.includes(game)) return next;
      next.caseGame = game;
      const eligible = NPCS.filter(person => next.votes[person] !== game && state.reputation[person] >= 0).sort((a, b) => {
        const aScore = state.reputation[a] + (interestEngaged && interestEngaged[a] ? 1 : 0);
        const bScore = state.reputation[b] + (interestEngaged && interestEngaged[b] ? 1 : 0);
        return bScore - aScore || hashSeed(state.seedInput + "|lobby-shift|" + game + "|" + a) - hashSeed(state.seedInput + "|lobby-shift|" + game + "|" + b);
      });
      const roll = hashSeed(state.seedInput + "|shift-count|" + game) % 100;
      const topTrust = eligible.length ? state.reputation[eligible[0]] + (interestEngaged && interestEngaged[eligible[0]] ? 1 : 0) : -1;
      const shiftCount = !eligible.length ? 0 : topTrust >= 2 ? 1 + (roll < 34 ? 1 : 0) : topTrust >= 1 ? 1 : roll < 58 ? 1 : 0;
      const remainingShiftSlots = Math.max(0, 2 - next.shifted.length);
      eligible.slice(0, Math.min(remainingShiftSlots, shiftCount)).forEach(person => {
        next.votes[person] = game;
        next.shifted.push(person);
      });
      return next;
    }
    function resolveTableVote(state, plan, playerVote) {
      const counts = {};
      plan.candidates.forEach(game => { counts[game] = 0; });
      counts[playerVote] = (counts[playerVote] || 0) + 1;
      NPCS.forEach(person => { counts[plan.votes[person]] = (counts[plan.votes[person]] || 0) + 1; });
      const order = plan.candidates.slice().sort((a, b) => counts[b] - counts[a] || hashSeed(state.seedInput + "|table-vote-result|" + state.completed.length + "|" + a) - hashSeed(state.seedInput + "|table-vote-result|" + state.completed.length + "|" + b));
      const votes = copy(plan.votes);
      const shifted = plan.shifted.slice();
      let winner = order[0];
      const favourPlayer = hashSeed(state.seedInput + "|player-vote-priority|" + state.completed.length) % 100 < 62;
      if (favourPlayer && winner !== playerVote) {
        const movable = NPCS.filter(person => votes[person] !== playerVote);
        for (let index = 0; index < movable.length; index += 1) {
          const person = movable[index];
          counts[votes[person]] = Math.max(0, (counts[votes[person]] || 0) - 1);
          votes[person] = playerVote;
          counts[playerVote] = (counts[playerVote] || 0) + 1;
          if (shifted.indexOf(person) === -1) shifted.push(person);
          const best = plan.candidates.slice().sort((a, b) => counts[b] - counts[a])[0];
          if (best === playerVote) break;
        }
        winner = playerVote;
      }
      return { winner, counts, playerVote, npcVotes: votes, initialVotes: copy(plan.initialVotes), shifted };
    }

    function saveDebrief(state, game, answers) {
      let s = copy(state);
      s.debriefs[game] = { ...answers, savedAt: timeStamp() };
      s.view = "lobby";
      s.activeGame = null;
      return log(s, "debrief", "Saved debrief for " + game);
    }
    function addLog(state, type, text) { return log(copy(state), type, text); }
    function setView(state, view) { const s = copy(state); s.view = view; return s; }
    function setChat(state, chat) { const s = copy(state); s.chat = chat; return s; }
    function markExchange(state, key, trigger) {
      const s = copy(state);
      if (s.exchangeRounds[key]) return { state: s, allowed: false };
      s.exchangeRounds[key] = true;
      return { state: log(s, "exchange", "CHARACTER EXCHANGE trigger " + trigger + " in " + key), allowed: true };
    }
    function sessionRoster(state) { return NPCS.map(p => state.characters[p].id); }
    function findArchetype(state, type) { return NPCS.find(p => archetypeOf(state, p) === type) || null; }

    function sessionRoundCount(state) {
      return state.shoal.history.length + state.collection.history.length + state.city.history.length + state.signal.history.length + state.envelope.history.length + state.constellation.history.length + state.lantern.history.length;
    }
    function prepareArrival(state) {
      let s = copy(state);
      if (s.room.arrivalPrepared) return s;
      s.room.arrivalPrepared = true;
      const before = Math.max(0, s.room.joinPosition - 1);
      if (before > 0) {
        const thread = PRE_ARRIVAL_THREADS[hashSeed(s.seedInput + "|pre-arrival-thread") % PRE_ARRIVAL_THREADS.length];
        const count = Math.max(2, Math.min(6, thread.length));
        const present = NPCS.slice(0, before);
        const base = Date.now() - (count + 1) * 11000;
        thread.slice(0, count).forEach((fragment, index) => {
          const person = present[fragment.speaker % present.length];
          s.chat.push({ person, text: fragment.text, at: new Date(base + index * 9000).toISOString(), playerReaction: null, characterReactions: [], preArrival: true });
        });
      }
      s.chat.push({ person: null, kind: "system", text: s.playerProfile.name + " joined.", at: new Date().toISOString(), playerReaction: null, characterReactions: [] });
      return log(s, "room", "Player arrived in position " + s.room.joinPosition + (before ? " with " + Math.min(6, PRE_ARRIVAL_THREADS[hashSeed(s.seedInput + "|pre-arrival-thread") % PRE_ARRIVAL_THREADS.length].length) + " earlier chat messages present" : " to an empty room"));
    }
    function matchmakingPlan(state, retry) {
      const salt = state.seedInput + "|matchmaking|" + (retry ? "retry" : "first");
      const failed = !retry && hashSeed(salt + "|fail") % 5 === 0;
      const duration = retry ? 3000 + hashSeed(salt + "|duration") % 4001 : 3000 + hashSeed(salt + "|duration") % 12001;
      const drop = !failed && hashSeed(salt + "|drop") % 100 < 24;
      return { failed, duration, drop, joinPosition: state.room.joinPosition };
    }
    function spendRoomEvent(state, type, game, person) {
      let s = copy(state);
      const room = s.room;
      if (!room || room.eventBudget <= 0 || room.eventLedger.some(item => item.game === game) || sessionRoundCount(s) < 2) return { state: s, allowed: false };
      if (person && (!NPCS.includes(person) || person === s.depth.quietSlot || person === s.depth.helpReservedSlot || person === s.depth.helpTarget || room.specialRoles[person])) return { state: s, allowed: false };
      room.eventBudget -= 1;
      room.eventLedger.push({ type, game, person: person || null, afterRound: sessionRoundCount(s) });
      if (person) room.specialRoles[person] = type;
      s = log(s, "theater", "ROOM EVENT " + type + " spent one event budget point in " + game + (person ? " for " + personName(s, person) : ""));
      return { state: s, allowed: true };
    }
    function replaceSeat(state, slot) {
      let s = copy(state);
      if (!NPCS.includes(slot)) return { state: s, character: null };
      const usedIds = new Set((s.room.seenCharacterIds || []).concat(NPCS.map(person => s.characters[person].id)));
      const available = ROSTER.filter(character => !usedIds.has(character.id));
      if (!available.length) return { state: s, character: null };
      const character = copy(available[hashSeed(s.seedInput + "|replacement|" + slot + "|" + sessionRoundCount(s)) % available.length]);
      const existingHandles = NPCS.filter(person => person !== slot).map(person => s.characters[person].name.toLowerCase());
      const pool = character.namePool && character.namePool.length ? character.namePool : [character.name];
      const start = hashSeed(s.seedInput + "|replacement-handle|" + character.id) % pool.length;
      character.canonicalName = character.name;
      character.name = pool.map((_, index) => pool[(start + index) % pool.length]).find(handle => !existingHandles.includes(handle.toLowerCase())) || pool[start];
      s.characters[slot] = character;
      s.reputation[slot] = 0;
      s.room.seenCharacterIds.push(character.id);
      s.room.specialRoles[slot] = "replacement";
      return { state: log(s, "room", character.name + " joined as a replacement in seat " + slot), character: copy(character) };
    }
    function recordBlockedAttempt(state, game) {
      let s = copy(state);
      const key = game || "lobby";
      s.room.blockedAttempts += 1;
      s.room.blockedByGame[key] = (s.room.blockedByGame[key] || 0) + 1;
      return log(s, "moderation", "Blocked message count is now " + s.room.blockedAttempts + ". No attempted text was retained");
    }
    function recordReport(state, report) {
      let s = copy(state);
      s.room.reports.push(copy(report));
      return log(s, "report", "Player reported " + personName(s, report.person) + " for " + report.reason + " at " + report.ref);
    }
    function adjustReputation(state, person, amount, reason) {
      let s = copy(state);
      if (!NPCS.includes(person)) return s;
      s.reputation[person] = clamp((s.reputation[person] || 0) + amount, -8, 8);
      return log(s, "reputation", personName(s, person) + " changed by " + amount + " after " + reason);
    }

    return {
      PEOPLE, NPCS, ARCHETYPES, ROSTER, LINES, ARTWORKS, fresh, startGame, resolveShoal, shoalOutcome,
      resolveAuction, collectionScores, makeAgreement, addAgreementSignal,
      proposerForRound, submitCityProposal, resolveCityVote, cityScores,
      resolveSignal, signalScores, recordSignalPromise,
      envelopePairings, submitEnvelopeSend, resolveEnvelopeReturn, envelopeScores,
      prepareConstellation, resolveConstellation, constellationScores, constellationOutcome, recordConstellationIntent, constellationRiskNeeded,
      prepareLanternNight, resolveLanternNight, resolveLanternVote, lanternScores, lanternOutcome, recordLanternPlayerClaim, recordLanternPlayerAccusation, recordLanternAccusation,
      prepareTableVote, lobbyTableVote, resolveTableVote,
      saveDebrief, addLog, setView, setChat, setPlayerProfile, preferredCategory, categoryCount,
      personName, personProfile, archetypeOf, lineFor, patternLineFor, voiceText, markExchange, sessionRoster, findArchetype,
      isQuiet, assignGameDepth, conditionFor, noteQuietEngagement, markBurn, recordPlayerDecision,
      rawGameScores, withHelpScores, openPunishment, applyPunishment, followerPunishment, continueAfterPunishment, applyHelp,
      completeAbandonedGame, sessionRoundCount, prepareArrival, matchmakingPlan, spendRoomEvent, replaceSeat,
      recordBlockedAttempt, recordReport, adjustReputation
    };

  })();
})();

  const C = window.TeamplayContent;
  const key = 'gametheory-community:gametheory-avatar-choice-v2';
  const symbols = [...new Set([...C.PLAYER_EMOJIS, ...C.ROSTER.map(p => p.emoji)])];
  const portraits = Object.keys(C.ASSETS.characters);
  const colors = [...new Set([...C.PLAYER_COLORS, ...C.ROSTER.map(p => p.color)])];
  const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function hash(v) { let n=2166136261; for(const c of String(v)) n=Math.imul(n^c.charCodeAt(0),16777619); return n>>>0; }
  const read = () => { try { return localStorage.getItem(key); } catch { return null; } };
  const write = value => { try { localStorage.setItem(key,value); } catch { /* memory-only browser still works */ } selected=value; };
  let selected = read();
  function option(profile, person, seed) {
    if(person === 'you') {
      if(selected?.startsWith('portrait:') && portraits.includes(selected.slice(9))) return selected;
      return 'symbol:' + profile.emoji;
    }
    const slots=['nia','bram','tolu'];
    const symbolSeat=hash(seed+'|avatar-style')%3;
    const n=hash(seed+'|'+profile.id+'|shared-avatar-library');
    return slots.indexOf(person)===symbolSeat ? 'symbol:'+symbols[n%symbols.length] : 'portrait:'+portraits[n%portraits.length];
  }
  function icon(token, className='') {
    if(token.startsWith('portrait:')) return '<img class="shared-portrait '+esc(className)+'" src="'+C.ASSETS.characters[token.slice(9)]+'" alt="">';
    return '<span class="shared-symbol '+esc(className)+'">'+esc(token.slice(7))+'</span>';
  }
  function markup(profile,person,seed,className='') { return icon(option(profile,person,seed),className); }
  function mountPicker(root) {
    const picker=root.querySelector('#emojiPicker');
    if(!picker || picker.dataset.sharedLibrary) return;
    picker.dataset.sharedLibrary='true';
    const label=picker.parentElement;
    for(const node of label.childNodes) if(node.nodeType===3 && node.textContent.trim()) node.textContent='Your avatar';
    const library=document.createElement('div');library.className='avatar-library';
    const usePortrait=Boolean(selected?.startsWith('portrait:') && portraits.includes(selected.slice(9)));
    library.innerHTML='<div class="avatar-library-tabs" role="tablist" aria-label="Avatar style"><button type="button" role="tab" id="portraitTab" aria-controls="portraitPicker" aria-selected="'+usePortrait+'">Portraits <span>'+portraits.length+'</span></button><button type="button" role="tab" id="symbolTab" aria-controls="emojiPicker" aria-selected="'+!usePortrait+'">Symbols <span>'+symbols.length+'</span></button></div><div id="portraitPicker" role="tabpanel" aria-labelledby="portraitTab" class="portrait-picker" '+(!usePortrait?'hidden':'')+'>'+portraits.map((id,i)=>'<button type="button" class="portrait-pick" data-portrait="'+id+'" aria-label="Choose portrait '+(i+1)+'" aria-pressed="'+(selected==='portrait:'+id)+'">'+icon('portrait:'+id)+'</button>').join('')+'</div>';
    picker.before(library);library.append(picker);
    picker.setAttribute('role','tabpanel');picker.setAttribute('aria-labelledby','symbolTab');picker.hidden=usePortrait;
    const tabButtons=[...library.querySelectorAll('[role=tab]')];
    tabButtons[0].setAttribute('aria-label','Portraits '+portraits.length);
    tabButtons[1].setAttribute('aria-label','Symbols '+symbols.length);
    const show=portrait=>{picker.hidden=portrait;library.querySelector('#portraitPicker').hidden=!portrait;tabButtons[0].setAttribute('aria-selected',String(portrait));tabButtons[1].setAttribute('aria-selected',String(!portrait));};
    tabButtons.forEach((button,i)=>{button.onclick=()=>show(i===0);button.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();show(i!==0);tabButtons[1-i].focus();}};});
    const selectPortrait=id=>{
      const p=C.ROSTER.find(p=>p.id===id);
      const native=[...picker.querySelectorAll('.emoji-pick')].find(b=>b.dataset.emoji===p.emoji);
      native?.click();write('portrait:'+id);
      library.querySelectorAll('.portrait-pick').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.portrait===id)));
      updatePreview();
    };
    library.querySelectorAll('.portrait-pick').forEach(b=>b.onclick=()=>selectPortrait(b.dataset.portrait));
    picker.addEventListener('click',e=>{const b=e.target.closest('.emoji-pick');if(b){write('symbol:'+b.dataset.emoji);library.querySelectorAll('.portrait-pick').forEach(p=>p.setAttribute('aria-pressed','false'));updatePreview();}});
    const preview=document.createElement('div');preview.className='avatar-current';
    label.before(preview);
    function updatePreview(){const native=picker.querySelector('.emoji-pick.selected')?.dataset.emoji||symbols[0];preview.innerHTML='<span class="avatar-current-icon">'+icon(selected?.startsWith('portrait:')?selected:'symbol:'+native)+'</span><span><strong>Your place at the table</strong><small>'+ (portraits.length+symbols.length)+' avatars. The same collection for everyone.</small></span>';}
    updatePreview();
  }
  window.GameTheoryAppearance={emojis:symbols,colors,portraits,options:[...symbols.map(s=>'symbol:'+s),...portraits.map(s=>'portrait:'+s)],markup,icon,option,mountPicker};
})();
</script><script id="gametheory-worlds">/* Cinematic scenes derived only from information already visible in the original game. */

  function city(s,health,changed,mini) {

  function constellation(s,row,mini) {

    const starDots=Array.from({length:70},(_,i)=>'<circle class="map-star" cx="'+((i*167+71)%1020)+'" cy="'+((i*113+37)%650)+'" r="'+(i%5===0?1.2:.55)+'" style="animation-delay:-'+(i%9)+'s"/>').join('');

    return scene('constellation','Crew network '+g.score+' points. North Relay '+g.rivals.north[index]+'. Meridian '+g.rivals.meridian[index]+'.',heading('DEEP SPACE ARRAY','Build something greater.','CYCLE '+Math.min(6,g.round)+' / 6')+'<svg class="constellation-map" viewBox="0 0 1020 650" aria-label="Network connections from completed rounds"><defs><filter id="starGlow"><feGaussianBlur stdDeviation="3"/></filter><radialGradient id="coreLight"><stop stop-color="#bdedff" stop-opacity=".32"/><stop offset="1" stop-color="#459bdc" stop-opacity="0"/></radialGradient></defs>'+starDots+'<ellipse class="map-orbit" cx="510" cy="340" rx="260" ry="147"/><ellipse class="map-orbit outer-orbit" cx="510" cy="340" rx="344" ry="209"/><path class="map-axis" d="M510 90v480M130 340h760"/>'+foundation+paths+'<circle cx="510" cy="340" r="108" fill="url(#coreLight)"/><circle class="core-ring" cx="510" cy="340" r="63"/><circle class="core-ring outer" cx="510" cy="340" r="73"/><text class="core-score" x="510" y="345" text-anchor="middle">'+g.score+'</text><text class="core-label" x="510" y="368" text-anchor="middle">YOUR NETWORK</text>'+nodes+'</svg><div class="network-legend"><span><i class="anchor-dot"></i>Anchor</span><span><i class="beacon-dot"></i>Beacon</span><span><i class="nebula-dot"></i>Nebula</span></div>'+footer([['YOUR CREW',g.score],['NORTH RELAY',g.rivals.north[index]],['MERIDIAN',g.rivals.meridian[index]]])+last,mini,'network-level-'+Math.min(3,Math.floor(g.score/16)));

</script><script id="gametheory-moments">/* Public history only. These summaries never inspect pending choices or hidden roles. */
(() => {
  const E=window.TeamplayEngine,C=window.TeamplayContent;
  const total=values=>Object.values(values||{}).reduce((sum,n)=>sum+(Number(n)||0),0);
  function round(state,game,index){
    const row=state[game]?.history?.[index];if(!row)return null;
    const num=row.round||row.night||row.index||index+1;
    let title='',detail='',metric=0,label='',actions={},positive=true;
    if(game==='shoal'){title=row.total+' fish taken';detail=row.remaining+' remained before the shoal could recover.';metric=Math.round(row.stock);label='Fish after regrowth';positive=row.remaining>=8;for(const p of E.PEOPLE)actions[p]=(row.takes[p]??0)+' fish';}
    if(game==='city'){title=row.accepted?'An agreement was reached':'The proposed split was rejected';detail=row.event?.name?row.event.name.charAt(0).toUpperCase()+row.event.name.slice(1)+(row.eventHelped?' · the city held':' · the city was tested'):'The city ended this round at '+row.health+' integrity.';metric=row.health;label='City integrity / 10';positive=row.accepted;for(const p of E.PEOPLE)actions[p]=(row.applied[p]??0)+' resources';}
    if(game==='signal'){const hunters=Object.values(row.choices).filter(c=>c==='hunt').length;title=row.allHunt?'The whole table hunted together':'The group chose different paths';detail=hunters+' of 4 chose the shared hunt.';metric=total(row.gains);label='Food this hunt';positive=row.allHunt;for(const p of E.PEOPLE)actions[p]=(row.choices[p]==='hunt'?'Together':'Alone')+' · +'+(row.gains[p]??0);}
    if(game==='envelope'){title=total(row.sends)+' coins sent in trust';detail='The exchanges settled. What returned shaped the next round.';metric=row.final.you;label='Coins you kept';positive=row.final.you>=(row.sends.you||0);for(const p of E.PEOPLE)actions[p]=(row.final[p]??0)+' kept';}
    if(game==='collection'){const id=typeof row.art==='string'?row.art:row.art.id;title=C.DISPLAY_ART[id]?.title||'The auction settled';detail=E.personName(state,row.winner)+' won the painting for '+row.price+' coins.';metric=row.price;label='Winning bid';positive=row.winner==='you';for(const p of E.PEOPLE)actions[p]=(row.bids[p]??0)+' bid'+(p===row.winner?' · won':'');}
    if(game==='constellation'){title=(row.delta>=0?'+':'')+row.delta+' to your network';detail=row.nebulaCount>1?'Multiple Nebulas collided.':row.beaconCount===1?'A lone Beacon could not connect.':'The placements held together.';metric=row.score;label='Crew network';positive=!row.costly;for(const p of E.PEOPLE)actions[p]=row.choices[p].charAt(0).toUpperCase()+row.choices[p].slice(1)+' · '+(row.measure[p].success?'connected':'failed');}
    if(game==='lantern'){title=row.success?'The flame held':'The flame faltered';detail=row.contributed+' of 3 oil contributions reached the lantern.';metric=row.contributed;label='Oil received / 3';positive=row.success;for(const p of E.PEOPLE)actions[p]=row.selected.includes(p)?'Tended the lantern':'Watched the crossing';}
    return{num,title,detail,metric,label,actions,positive};
  }
  window.GameTheoryMoments=Object.freeze({round});
})();
</script><script>
