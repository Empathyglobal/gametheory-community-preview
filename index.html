      data.changes.forEach(sentence => lines.push(sentence));
      lines.push("", "THE PLAYER'S OWN WORDS");
      data.answers.forEach(game => {
        lines.push("", game.game + " (" + game.source + ")");
        game.rows.forEach(row => { lines.push(row.question); lines.push(row.text); });
      });
      lines.push("", "WHAT THE EVIDENCE DOES NOT SHOW", data.limitation);
      lines.push("", "WORTH ASKING ABOUT", data.dinnerQuestion.text);
      return lines.join("\n");
    }
    function showSavedReport(id) {
      const record = readPastSessions().find(item => item.id === id);
      if (!record) return;
      savedReportOpen = id;
      reportView.classList.remove("hidden");
      reportView.innerHTML = '<div class="report-shell"><div class="report-head"><div><div class="eyebrow">Past session</div><h1 style="font-size:clamp(2.2rem,7vw,4rem);margin-bottom:8px">' + (record.left ? 'Game left' : 'Session report') + '</h1><div class="small muted">' + esc(new Date(record.date).toLocaleString()) + '</div></div><div class="report-actions"><button class="btn secondary" id="copySavedReport">Copy report</button><button class="btn secondary" id="printSavedReport">Print</button><button class="btn" id="closeSavedReport">Close</button></div></div><section class="report-section card saved-report"><pre>' + esc(record.reportText) + '</pre></section></div>';
      document.getElementById("copySavedReport").onclick = () => copyText(record.reportText);
      document.getElementById("printSavedReport").onclick = () => { try { window.print(); } catch (e) {} };
      document.getElementById("closeSavedReport").onclick = () => { savedReportOpen = null; reportView.classList.add("hidden"); };
    }
    function showSessionReport(fromLog) {
      reportReturnToLog = Boolean(fromLog);
      if (fromLog) logView.classList.add("hidden");
      const data = sessionReportData();
      reportView.classList.remove("hidden");
      reportView.innerHTML = '<div class="report-shell"><div class="report-head"><div><div class="eyebrow">Parent view</div><h1 style="font-size:clamp(2.2rem,7vw,4rem);margin-bottom:8px">Session report</h1><div class="small muted">Seed: ' + esc(state.seedInput) + '</div></div><div class="report-actions"><button class="btn secondary" id="copyReport">Copy report</button><button class="btn secondary" id="printReport">Print</button><button class="btn" id="closeReport">Close</button></div></div><section class="report-section card"><h2>What happened</h2>' + data.gameSections.map(section => '<h3>' + esc(section.title) + '</h3>' + section.sentences.map(sentence => '<p>' + esc(sentence) + '</p>').join("")).join("") + '</section><section class="report-section card"><h2>How the player treated the table</h2>' + data.tableTreatment.map(sentence => '<p>' + esc(sentence) + '</p>').join("") + '</section><section class="report-section card"><h2>Off topic chat</h2><p>' + esc(data.offTopic) + '</p></section><section class="report-section card"><h2>Reports</h2>' + (data.reports.length ? data.reports.map(sentence => '<p>' + esc(sentence) + '</p>').join("") : '<p>No report was submitted during this session.</p>') + '</section><section class="report-section card"><h2>Unequal starts</h2>' + (data.unequal.length ? data.unequal.map(sentence => '<p>' + esc(sentence) + '</p>').join("") : '<p>Every played game used an equal starting position.</p>') + '</section><section class="report-section card"><h2>The quiet player</h2><p>' + esc(data.quiet) + '</p></section>' + (data.help ? '<section class="report-section card"><h2>Costly help</h2><p>' + esc(data.help) + '</p></section>' : '') + '<section class="report-section card"><h2>What changed across the session</h2>' + data.changes.map(sentence => '<p>' + esc(sentence) + '</p>').join("") + '</section><section class="report-section card"><h2>The player\'s own words</h2><div class="report-answers">' + data.answers.map(game => '<div><h3>' + esc(game.game) + '</h3><div class="small muted">' + esc(game.source) + '</div>' + game.rows.map(row => '<div class="report-answer"><strong>' + esc(row.question) + '</strong><p class="answer-text">' + esc(row.text) + '</p></div>').join("") + '</div>').join("") + '</div></section><section class="report-section card"><h2>What the evidence does not show</h2><p>' + esc(data.limitation) + '</p></section><section class="report-section card dinner-question"><div><h2>Worth asking about</h2><p>' + esc(data.dinnerQuestion.text) + '</p></div><button class="btn secondary" id="copyDinner">Copy question</button></section></div>';
      document.getElementById("copyReport").onclick = () => copyText(sessionReportText(data));
      document.getElementById("copyDinner").onclick = () => copyText(data.dinnerQuestion.text);
      document.getElementById("printReport").onclick = () => { try { window.print(); } catch (e) {} };
      document.getElementById("closeReport").onclick = () => {
        reportView.classList.add("hidden");
        if (reportReturnToLog) logView.classList.remove("hidden");
        reportReturnToLog = false;
      };
    }
    function showParentLog() {
      reportView.classList.add("hidden");
      reportReturnToLog = false;
      const lines = state.log.map(entry => '[' + entry.at + '] [' + entry.type.toUpperCase() + '] ' + entry.text);
      lines.push('[MODERATION] Blocked message attempts: ' + (state.room.blockedAttempts || 0) + '. Attempted words were not retained.');
      logView.classList.remove("hidden");
      logView.innerHTML = '<div class="log-shell"><div class="log-head"><div><div class="eyebrow">Parent view</div><h2 style="margin:0">Session log</h2><div class="small muted">Seed: ' + esc(state.seedInput) + '</div></div><div class="log-actions"><button class="btn secondary" id="openReportFromLog">Session report</button><button class="btn secondary" id="copyLog">Copy everything</button><button class="btn secondary" id="clearSavedHistory">Clear saved history</button><button class="btn" id="closeLog">Close</button></div></div><div class="rule-row"><strong>Blocked message attempts</strong>' + (state.room.blockedAttempts || 0) + '. Attempted words are never stored.</div><ul class="log-list">' + state.log.map(entry => '<li class="' + (entry.type === "signal" ? "signal-log" : entry.type === "flag" ? "flag-log" : "") + '">[' + esc(entry.at) + '] [' + esc(entry.type.toUpperCase()) + '] ' + esc(entry.text) + '</li>').join("") + '</ul></div>';
      document.getElementById("openReportFromLog").onclick = () => showSessionReport(true);
      document.getElementById("copyLog").onclick = () => copyText("TEAMPLAY SESSION\nSeed: " + state.seedInput + "\n\n" + lines.join("\n"));
      document.getElementById("clearSavedHistory").onclick = () => { if (window.confirm("Clear all saved character history on this device?")) clearSavedHistory(); };
      document.getElementById("closeLog").onclick = () => { logView.classList.add("hidden"); };
    }

    function unlockAudio() {
      if (audioStarted) return;
      audioStarted = true;
      Audio.unlock();
      if (state.view === "game" || state.view === "linger") startAmbient(state.activeGame);
    }
    document.addEventListener("pointerdown", unlockAudio, { once: true });
    document.addEventListener("keydown", unlockAudio, { once: true });
    document.addEventListener("error", event => {
      const image = event.target;
      if (!image || !image.classList || !image.classList.contains("pixel-asset")) return;
      const stack = image.closest(".asset-stack");
      if (stack) stack.classList.add("asset-failed");
      image.hidden = true;
    }, true);
    document.addEventListener("click", e => {
      if (chatSheetOpen && !e.target.closest("#persistentChat") && !e.target.closest("#chatSheetToggle")) collapseChatSheet();
      if (quickChatOpen && !e.target.closest("#quickChatPanel") && !e.target.closest("#quickChatButton")) closeQuickChat();
      const report = e.target.closest("[data-report-person]");
      if (report) { e.preventDefault(); e.stopPropagation(); openReportSheet(report.dataset.reportPerson, report.hasAttribute("data-report-message") ? Number(report.dataset.reportMessage) : null); return; }
      const reaction = e.target.closest("[data-reaction-message]");
      if (reaction) { e.preventDefault(); e.stopPropagation(); togglePlayerReaction(Number(reaction.dataset.reactionMessage), reaction.dataset.reaction, true); return; }
      const bubble = e.target.closest(".bubble");
      if (bubble) { e.preventDefault(); const row = bubble.closest("[data-message]"); if (row) toggleReactionPicker(Number(row.dataset.message)); return; }
      const artwork = e.target.closest("[data-art]");
      if (artwork) { e.preventDefault(); showArtwork(artwork.dataset.art); return; }
      const button = e.target.closest("[data-profile]");
      if (button) { e.preventDefault(); showProfile(button.dataset.profile, button); return; }
      if (activeReactionIndex !== null) { const previous = activeReactionIndex; activeReactionIndex = null; refreshMessage(previous); }
    });
    document.addEventListener("keydown", e => {
      if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("bubble")) {
        e.preventDefault(); const row = e.target.closest("[data-message]"); if (row) toggleReactionPicker(Number(row.dataset.message), true);
      }
      if (modal.classList.contains("hidden")) return;
      if (e.key === "Escape") { e.preventDefault(); closeModal(); return; }
      if (e.key === "Tab") {
        const focusable = Array.from(modal.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'));
        if (!focusable.length) { e.preventDefault(); return; }
        const first = focusable[0], last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });
    modal.addEventListener("click", e => {
      if (e.target.closest("[data-close-modal]")) { closeModal(); return; }
      if (e.target === modal && (modal.dataset.kind === "profile" || modal.dataset.kind === "art")) closeModal();
    });
    rulesButton.onclick = () => { if (state.view === "game") showRules(state.activeGame, true); };
    muteButton.onclick = () => {
      soundEnabled = !soundEnabled;
      muteButton.textContent = soundEnabled ? "🔊" : "🔇";
      muteButton.setAttribute("aria-label", soundEnabled ? "Mute sound" : "Turn sound on");
      muteButton.title = soundEnabled ? "Mute sound" : "Turn sound on";
      Audio.setEnabled(soundEnabled);
      if (soundEnabled) { if (state.view === "game" || state.view === "linger") startAmbient(state.activeGame); playTone("lock"); }
    };
    leaveButton.onclick = () => { if (window.confirm("Leave this room and clear the session?")) leaveRoom(); };
    const cancelRoomCodePress = () => { if (roomCodePressTimer) clearTimeout(roomCodePressTimer); roomCodePressTimer = null; };
    roomCodeButton.addEventListener("pointerdown", () => {
      cancelRoomCodePress();
      if (state.view === "landing") return;
      roomCodePressTimer = setTimeout(() => { roomCodePressTimer = null; showParentLog(); }, 1500);
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(type => roomCodeButton.addEventListener(type, cancelRoomCodePress));
    roomCodeButton.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("keydown", e => { if (e.shiftKey && e.key.toLowerCase() === "p") { e.preventDefault(); showParentLog(); } });
    window.addEventListener("resize", () => {
      if (window.innerWidth > 840) unread = 0;
      const mobileNow = window.innerWidth <= 560;
      if (mobileNow !== lastMobileLayout) {
        lastMobileLayout = mobileNow;
        collapseChatSheet();
        if (state.view === "game") render();
      }
    });
    window.addEventListener("pagehide", () => archiveAbandonedSession("left the room"));
    window.addEventListener("pageshow", event => {
      if (!event.persisted || state.view === "landing") return;
      const oldRoster = Engine.sessionRoster(state), player = { ...state.playerProfile };
      resetUiSession();
      replaySeed = String(Date.now() + 15401);
      state = Engine.fresh(replaySeed, oldRoster, player);
      sessionHistoryArmed = false;
      try { window.history.replaceState(null, "", window.location.pathname + window.location.search); } catch (e) {}
      render();
    });
    window.addEventListener("beforeunload", () => archiveAbandonedSession("left the room"));
    window.addEventListener("popstate", () => {
      if (state.view === "landing") return;
      if (window.confirm("Leave this room and clear the session?")) leaveRoom();
      else {
        try { window.history.pushState({ teamplayRoom: true }, ""); sessionHistoryArmed = true; } catch (e) {}
      }
    });
    function renderAssetLoading() {
      app.innerHTML = '<section class="screen asset-loading"><div class="loading-room"><div class="eyebrow">GAMETHEORY</div><h1>Waking the room</h1><div class="loading-blocks" aria-label="Loading game art">██████░░░░</div><p class="small muted">Setting the table and checking the signal.</p></div></section>';
    }
    renderAssetLoading();
    preloadAssets().then(render);
    return { getState: () => state, setState, showParentLog, test: { hasBlockedLanguage, submitPlayerMessage, addSystemEvent, openReportSheet, maybeRoomAuthenticity, negativeEventsFor } };
  })();
})();

</script>
<script>
(function(){try{
  function getScroll(){return document.getElementById('messages');}
  function nearBottom(){var el=getScroll();if(!el)return true;return el.scrollHeight-el.scrollTop-el.clientHeight<80;}
  function pin(force){var el=getScroll();if(!el)return;if(force||nearBottom()){el.scrollTop=el.scrollHeight;}}
  function setupChat(){
    var el=getScroll();
    if(!el)return;
    pin(true);
    if(el.getAttribute('data-tp-pinned'))return;
    el.setAttribute('data-tp-pinned','1');
    new MutationObserver(function(){pin(true);}).observe(el,{childList:true,subtree:true});
  }
  setupChat();
  var sheet=document.getElementById('chatSheetToggle');
  if(sheet){sheet.addEventListener('click',function(){setTimeout(function(){pin(true);},80);});}

  function pruneStanding(){
    var nodes=document.querySelectorAll('.system-event-line,.msg,.standing-damage');
    nodes.forEach(function(n){
      var txt=(n.textContent||'').trim();
      if(txt.indexOf('Standing fell with ')===0){if(n.parentNode){n.parentNode.removeChild(n);}}
    });
  }

  function checkMatch(){
    var mc=document.getElementById('matchingChat');
    var slots=document.querySelectorAll('.join-slot');
    if(!slots.length){return;}
    var all=true;
    for(var i=0;i<slots.length;i++){if(!slots[i].classList.contains('arrived')){all=false;break;}}
    if(mc){mc.style.display=all?'':'none';}
    if(all){
      var t=document.getElementById('matchTitle');if(t){t.textContent='Table ready';}
      var s=document.getElementById('matchSub');if(s){s.textContent='Everyone is here.';}
    }
  }

  var STORIES={
    Shoal:{intro:'You and three others fish the same shoal. The village eats what you bring back.\nThe fish breed back between seasons, but only if enough are left in the water.\nTake too much, too fast, and the shoal collapses and does not return.',goal:'GOAL: the four of you must land 220 between you or the village does not make it through winter. If the village survives, whoever landed the most eats best. If the shoal collapses, nobody wins, whatever their own catch.'},
    Collection:{intro:'You and three others are furnishing a new gallery. Nine works come up for auction, one at a time. You each have 100 coins for the whole season and no more are coming. Everyone values the works differently, and only you know what yours are worth to you.',goal:'GOAL: end with the most valuable collection. Three works from one category earns a bonus. Coins you never spend are worth nothing when the season closes.'},
    City:{intro:'You and three others are rebuilding a city after a bad year. Each round the harvest comes in and has to be divided between you. Agree a fair split and the city grows stronger. Argue, or take without agreement, and the walls stay unrepaired.\nBetween rounds things happen. Drought. Raiders. A festival. A strong city comes through them. A weak one loses what it has.',goal:'GOAL: end with the most for your own family. But if the city falls, everyone\'s share is halved, so you can finish rich in a place that no longer stands.'},
    Signal:{intro:'Four hunters at a fire at the edge of the forest. A stag feeds everyone well but takes all four of you to bring down. A hare you can catch alone, and it barely feeds one.\nIf even one person slips away after a hare, the stag escapes and everyone who stayed goes home with nothing.',goal:'GOAL: score the most over five hunts. The only thing you have to go on is what people say at the fire.'},
    Envelope:{intro:'Four traders. Each round you are paired with one other and you both hold ten coins. Whatever you send them triples on the way. Then they decide how much comes back, and you decide the same for what they sent you.',goal:'GOAL: end with the most coins. Send nothing and you keep ten. Send everything to someone who keeps it and you end with nothing.'},
    Constellation:{intro:'You and three others crew a station charting the sky. Two other crews are doing the same work, and only the strongest network gets funded next season.\nAnchors are safe and small. Beacons are worth far more, but only if somebody else lights one the same night. A Nebula is worth the most of all, and it fails completely if two of you reach for it at once.\nYou can say anything you like before the choices lock. Nothing makes you keep your word.',goal:'GOAL: build a bigger network than both rival crews. Play safe every round and you will lose politely.'},
    Lantern:{intro:'Four travellers, one road, one lantern, and five nights to cross.\nEach night three of you tend the flame. You each decide in secret whether to give up some of your own oil or quietly keep it. Only the outcome is shown. The lantern either holds through the night or it does not, and nobody is told who let it fail.\nOne traveller was paid before you set out to make sure this group never reaches the other side. It might be one of them.\nIt might be you. You will know, and nobody else will.',goal:'GOAL: if you are travelling honestly, reach the far side and name the saboteur. If you are the saboteur, make sure they never get there, and never let them prove it was you.'}
  };
  function storyFor(title){
    var keys=['Shoal','Collection','City','Signal','Envelope','Constellation','Lantern'];
    for(var i=0;i<keys.length;i++){if(title.indexOf(keys[i])!==-1){return STORIES[keys[i]];}}
    return null;
  }
  function setupStory(dt){
    if(dt.getAttribute('data-tp-story'))return;
    var card=dt.parentElement;
    while(card&&!card.querySelector('#rulesReady')){card=card.parentElement;}
    if(!card){return;}
    var story=storyFor((dt.textContent||'').trim());
    if(!story){return;}
    dt.setAttribute('data-tp-story','1');
    var block=document.createElement('div');
    block.className='tp-story';
    var p=document.createElement('p');
    p.style.whiteSpace='pre-line';
    p.textContent=story.intro;
    var g=document.createElement('p');
    g.className='tp-goal';
    g.textContent=story.goal;
    block.appendChild(p);block.appendChild(g);
    dt.parentNode.insertBefore(block,dt.nextSibling);
  }
  function setupAllStories(){document.querySelectorAll('#dialogTitle').forEach(setupStory);}

  function setupShoalLoss(){
    document.querySelectorAll('.flash').forEach(function(el){
      if(el.getAttribute('data-tp-loss'))return;
      if((el.textContent||'').indexOf('Nobody won The Shoal')===-1)return;
      el.setAttribute('data-tp-loss','1');
      var head=document.createElement('div');
      head.className='tp-loss-headline';
      head.textContent='EVERYONE LOSES';
      el.parentNode.insertBefore(head,el);
      var para=document.createElement('div');
      para.className='tp-loss-paragraph';
      para.textContent='The shoal is gone. The nets come up empty for the rest of the season, the village goes hungry through winter, and the boats are sold one by one.';
      el.parentNode.insertBefore(para,el.nextSibling);
    });
  }

  var selectedGame=null,voted=false,lastBallotSig='';
  function ballotSig(){
    var parts=[];
    document.querySelectorAll('.ballot-card').forEach(function(c){parts.push(c.getAttribute('data-game-card')||(c.textContent||'').trim());});
    return parts.join('|');
  }
  function clearVoteSelection(){
    document.querySelectorAll('.ballot-card').forEach(function(c){
      c.classList.remove('tp-vote-selected','tp-vote-dim');
      c.style.pointerEvents='';
      var t=c.querySelector('.tp-vote-tick');if(t){t.remove();}
    });
  }
  function resetBallot(){
    voted=false;selectedGame=null;clearVoteSelection();
  }
  function dimUnselected(){
    document.querySelectorAll('.ballot-card').forEach(function(c){
      if(c.classList.contains('tp-vote-selected')){c.classList.remove('tp-vote-dim');}
      else{c.classList.add('tp-vote-dim');}
    });
  }
  function ensureTick(card){
    if(!card.querySelector('.tp-vote-tick')){
      var tick=document.createElement('span');
      tick.className='tp-vote-tick';
      tick.textContent='\u2713';
      card.appendChild(tick);
    }
  }
  function applySelection(){
    document.querySelectorAll('.ballot-card').forEach(function(c){c.classList.remove('tp-vote-selected');var t=c.querySelector('.tp-vote-tick');if(t){t.remove();}});
    if(selectedGame){
      var card=document.querySelector('.ballot-card[data-game-card="'+selectedGame+'"]');
      if(card){card.classList.add('tp-vote-selected');ensureTick(card);}
    }
    dimUnselected();
  }
  function setupVoteUI(){
    var grid=document.querySelector('.ballot-grid');
    var first=document.querySelector('.ballot-card');
    var anchor=grid||first;
    if(!anchor)return;
    var parent=anchor.parentNode;
    // Detect a new ballot by the set of ballot cards changing, and reset the
    // vote state for it (the previous flag-only approach left it stuck on Voted).
    var cards=document.querySelectorAll('.ballot-card');
    var fresh=false;
    cards.forEach(function(c){if(!c.getAttribute('data-tp-vote')){fresh=true;}});
    var sig=ballotSig();
    if(sig!==lastBallotSig||(fresh&&voted)){
      lastBallotSig=sig;
      resetBallot();
    }
    var inst=parent.querySelector('.tp-vote-instruction');
    if(!inst){
      inst=document.createElement('div');
      inst.className='tp-vote-instruction';
      parent.insertBefore(inst,anchor);
    }
    inst.textContent=voted?'Voted. Waiting for the table.':'Tap a game, then cast your vote.';
    var btn=parent.querySelector('.tp-cast-vote');
    if(!btn){
      btn=document.createElement('button');
      btn.type='button';
      btn.className='tp-cast-vote';
      parent.appendChild(btn);
      btn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();if(!selectedGame||voted)return;voted=true;btn.disabled=true;btn.textContent='Voted';document.querySelectorAll('.ballot-card').forEach(function(c){c.style.pointerEvents='none';});var ins=document.querySelector('.tp-vote-instruction');if(ins){ins.textContent='Voted. Waiting for the table.';}});
    }
    btn.textContent=voted?'Voted':'Cast vote';
    btn.disabled=!selectedGame||voted;
    if(voted){document.querySelectorAll('.ballot-card').forEach(function(c){c.style.pointerEvents='none';});}
  }
  function setupVoteClicks(){
    document.querySelectorAll('.ballot-card').forEach(function(card){
      if(card.getAttribute('data-tp-vote'))return;
      card.setAttribute('data-tp-vote','1');
      card.addEventListener('click',function(){
        if(voted)return;
        selectedGame=card.getAttribute('data-game-card');
        applySelection();
        var btn=document.querySelector('.tp-cast-vote');if(btn){btn.disabled=false;}
      });
    });
    if(selectedGame){applySelection();}
  }

  var skipped=0;
  var BALLOT_DESCS={
    Shoal:'Four boats, one shoal, one village to feed. Big catches feel great until the fish run out and everyone starves. Land the most WITHOUT sinking the village. About 6 rounds.',
    Collection:'An auction night. Nine paintings, 100 coins for the whole evening, and everyone secretly values them differently. Win the ones YOU care about, chase 3 of a kind for a bonus, and remember leftover coins count for nothing. 9 lots.',
    City:'One harvest at a time, somebody proposes a split and the table votes. Fair splits make the city strong before drought and raiders arrive. Get rich, but if the city falls, everyone\'s share is cut in half. 5 rounds.',
    Signal:'A night hunt. The stag feeds everyone but needs all four hunters. A hare feeds only you. Promise whatever you like at the fire, then find out who meant it. 5 hunts.',
    Envelope:'A trust trade. Whatever you send your partner triples on the way there. Then they decide what comes back. Go big together and get rich, or get burned. 4 rounds.',
    Constellation:'Your table is ONE crew, and two rival crews are building too. Each round you place 3 power. Anchors always work but pay little. Beacons pay well if somebody comes with you. A Nebula pays most of all and fails if two of you reach for it. Talk first, then all four choices reveal at once. 6 rounds.',
    Lantern:'Five nights, one lantern, four travellers. Each night three of you tend it and secretly add oil or hold it back. Only the result shows, never who did what. One traveller was paid to make sure you never arrive, and it might be you. 5 nights.'
  };
  function cardDescription(card){
    var txt=(card.textContent||'')+' '+(card.getAttribute('data-game-card')||'');
    var keys=['Shoal','Collection','City','Signal','Envelope','Constellation','Lantern'];
    for(var i=0;i<keys.length;i++){if(txt.indexOf(keys[i])!==-1){return BALLOT_DESCS[keys[i]];}}
    return '';
  }
  function setupBallot(card){
    if(card.getAttribute('data-tp-how'))return;
    var desc=cardDescription(card);
    if(!desc){skipped++;card.setAttribute('data-tp-how','skip');return;}
    card.setAttribute('data-tp-how','1');
    var btn=document.createElement('button');
    btn.type='button';
    btn.className='tp-how-btn';
    btn.textContent='How it works';
    var panel=document.createElement('div');
    panel.className='tp-how-panel';
    panel.textContent=desc;
    panel.style.display='none';

    bar.innerHTML='<span class="journey-label">YOUR TABLE’S JOURNEY</span><ol>'+Array.from({length:target},(_,i)=>{const id=steps[i],done=id&&completed.includes(id),active=id===state.activeGame&&state.view!=='lobby';return'<li class="'+(active?'current':done?'completed':'future')+'" '+(active?'aria-current="step"':'')+'><span class="journey-step">'+(done&&!active?'✓':String(i+1).padStart(2,'0'))+'</span><span>'+esc(id?names[id]:i===steps.length?'Next world':i>=3?'Bonus world':'Final world')+'</span></li>';}).join('')+'</ol>';
    shell.prepend(bar);
  }
  function arrangeBoard(state){
    const board=document.querySelector('#board');if(!board||board.dataset.experience)return;board.dataset.experience='true';
    const scene=board.querySelector('.world-scene'),controls=board.querySelector('.choice-panel');
    if(scene&&controls){
      const presence=board.querySelector('.table-presence');if(presence)board.prepend(presence);
      const stage=document.createElement('div');stage.className='experience-stage';stage.style.setProperty('--world-accent',colors[state.activeGame]);
      board.insertBefore(stage,presence?presence.nextSibling:board.firstChild);
      const sceneParent=scene.closest('#shoalSceneWrap')||scene;stage.append(sceneParent);stage.append(controls);
      const role=board.querySelector('.lantern-role');if(role)stage.insertBefore(role,controls);
      board.querySelectorAll('.mobile-scene-zone,.mobile-control-zone').forEach(zone=>{if(!zone.children.length)zone.remove();});
    }
    board.querySelectorAll('.round-grid').forEach(grid=>{if(grid.closest('.round-history'))return;const details=document.createElement('details');details.className='round-history';const summary=document.createElement('summary');summary.textContent='Round history';grid.before(details);details.append(summary,grid);});
    const timer=document.querySelector('#timer');if(timer&&!timer.querySelector('.time-track')){timer.insertAdjacentHTML('beforeend','<span class="time-track" aria-hidden="true"><i></i></span>');const number=timer.querySelector('#timerNumber');const update=()=>{const text=number?.textContent||'0:25',parts=text.split(':').map(Number),seconds=parts.length===2?parts[0]*60+parts[1]:parts[0];timer.style.setProperty('--remaining',Math.max(0,Math.min(1,seconds/25)));};if(number){new MutationObserver(update).observe(number,{childList:true,characterData:true,subtree:true});update();}}
    const rows=state[state.activeGame]?.history||[],key=state.seedInput+'|'+state.activeGame,last=lastRound.get(key)||0;if(rows.length>last){lastRound.set(key,rows.length);scene?.classList.add('round-arrived');setTimeout(()=>scene?.classList.remove('round-arrived'),2500);}
  }
  function decorateTransition(){
    const transition=document.querySelector('#transition');if(!transition||transition.classList.contains('hidden'))return;
    const card=transition.querySelector('.transition-card');if(!card||card.dataset.experience)return;card.dataset.experience='true';const state=UI.getState(),id=state.activeGame;if(!image(id))return;
    transition.style.setProperty('--reveal-image','url("'+image(id)+'")');transition.style.setProperty('--world-accent',colors[id]);card.insertAdjacentHTML('afterbegin','<div class="reveal-world-label">'+esc(names[id])+'</div><div class="reveal-art" aria-hidden="true"><img src="'+image(id)+'" alt=""></div>');
  }
  function mountWorld(){
    const scene=document.querySelector('.experience-stage .cinema-scene')||document.querySelector('.debrief .cinema-scene');if(sceneController?.scene===scene)return;sceneController?.dispose();sceneController=null;if(!scene)return;
    const world=UI.getState().activeGame,controller=new AbortController();let raf=0,visible=true,x=0,y=0,tx=0,ty=0,last=0;
    const intersection=new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;});intersection.observe(scene);
    scene.addEventListener('pointermove',event=>{if(event.pointerType==='touch')return;const rect=scene.getBoundingClientRect();tx=(event.clientX-rect.left)/rect.width-.5;ty=(event.clientY-rect.top)/rect.height-.5;},{signal:controller.signal});scene.addEventListener('pointerleave',()=>{tx=0;ty=0;},{signal:controller.signal});
    const atmosphere=document.createElement('canvas');atmosphere.className='world-atmosphere';atmosphere.setAttribute('aria-hidden','true');scene.append(atmosphere);const context=atmosphere.getContext('2d');let width=0,height=0;
    const resize=()=>{width=scene.clientWidth;height=scene.clientHeight;atmosphere.width=Math.round(width*Math.min(devicePixelRatio,1.5));atmosphere.height=Math.round(height*Math.min(devicePixelRatio,1.5));context?.setTransform(atmosphere.width/Math.max(1,width),0,0,atmosphere.height/Math.max(1,height),0,0);};const resizer=new ResizeObserver(resize);resizer.observe(scene);resize();
    const points=Array.from({length:world==='constellation'?62:world==='signal'?28:20},(_,i)=>({x:((i*167+53)%997)/997,y:((i*131+19)%541)/541,phase:i*2.319,r:.5+(i%4)*.38}));
    function draw(time){raf=requestAnimationFrame(draw);if(time-last<32||!visible||document.hidden||reduced())return;last=time;x+=(tx-x)*.045;y+=(ty-y)*.045;scene.style.setProperty('--camera-x',(x*13).toFixed(2)+'px');scene.style.setProperty('--camera-y',(y*9).toFixed(2)+'px');if(!context)return;context.clearRect(0,0,width,height);const t=time/1000;
      if(world==='constellation'){for(const p of points){context.globalAlpha=.18+Math.sin(t*.45+p.phase)*.14;context.fillStyle='#d6eeff';context.beginPath();context.arc(p.x*width+x*10,p.y*height+y*6,p.r,0,Math.PI*2);context.fill();}}
      if(world==='signal'||world==='lantern'){for(const p of points){const phase=(t*.075+p.y)%1;context.globalAlpha=Math.sin(phase*Math.PI)*.45;context.fillStyle=world==='signal'?'#ffc881':'#d7eab3';context.beginPath();const px=world==='signal'?width*(.48+(p.x-.5)*.15)+Math.sin(t+p.phase)*9:p.x*width+Math.sin(t*.2+p.phase)*12;context.arc(px,height*(.64-phase*.35),p.r*.65,0,Math.PI*2);context.fill();}}
      if(world==='shoal'){context.strokeStyle='#c5fff4';context.lineWidth=.75;for(let i=0;i<13;i++){context.globalAlpha=.05+Math.sin(t*.5+i)*.025;context.beginPath();for(let j=0;j<35;j++){const px=j*width/34,py=height*(.35+i*.037)+Math.sin(j*.6+t*.5+i)*3; j?context.lineTo(px,py):context.moveTo(px,py);}context.stroke();}}
      if(world==='city'||world==='lantern'){for(let i=0;i<3;i++){const gradient=context.createLinearGradient(0,0,width,0);gradient.addColorStop(0,'transparent');gradient.addColorStop(.5,'rgba(174,197,207,.025)');gradient.addColorStop(1,'transparent');context.globalAlpha=1;context.fillStyle=gradient;context.fillRect(Math.sin(t*.045+i)*width*.25,height*(.48+i*.1),width,height*.18);}}
      context.globalAlpha=1;
    }
    if(!reduced())raf=requestAnimationFrame(draw);
    scene.querySelectorAll('.network-link:not(.failed)').forEach(path=>{const tracer=path.cloneNode();tracer.classList.add('energy-trace');tracer.setAttribute('aria-hidden','true');tracer.style.setProperty('--path-length',path.getTotalLength());path.after(tracer);});
    const nodes=scene.querySelectorAll('.network-node');if(nodes.length){const hint=document.createElement('div');hint.className='network-inspection';hint.hidden=true;scene.append(hint);nodes.forEach(node=>{const show=()=>{hint.textContent=node.getAttribute('aria-label');hint.hidden=false;};const hide=()=>hint.hidden=true;node.addEventListener('pointerenter',show,{signal:controller.signal});node.addEventListener('focus',show,{signal:controller.signal});node.addEventListener('pointerleave',hide,{signal:controller.signal});node.addEventListener('blur',hide,{signal:controller.signal});});}
    if(world==='constellation'){const items=scene.querySelectorAll('.scene-stats strong'),values=[...items].map(e=>Number(e.textContent)),max=Math.max(...values,1);items.forEach((strong,i)=>strong.insertAdjacentHTML('afterend','<span class="race-track" aria-hidden="true"><i style="width:'+Math.min(100,values[i]/max*100)+'%"></i></span>'));}
    sceneController={scene,dispose(){cancelAnimationFrame(raf);controller.abort();intersection.disconnect();resizer.disconnect();atmosphere.remove();scene.querySelectorAll('.energy-trace,.network-inspection,.race-track').forEach(e=>e.remove());scene.style.setProperty('--camera-x','0px');scene.style.setProperty('--camera-y','0px');}};
  }
  function recap(state){
    if(!['debrief','linger'].includes(state.view))return;const game=state.activeGame,rows=state[game]?.history||[];if(!rows.length)return;
    const target=document.querySelector('.debrief-grid>.card')||document.querySelector('.linger-board');if(!target||target.querySelector('.moment-replay'))return;
    const moments=rows.map((r,i)=>M.round(state,game,i)),panel=document.createElement('section');panel.className='moment-replay';panel.style.setProperty('--world-accent',colors[game]);panel.setAttribute('aria-label','Explore the rounds');
    panel.innerHTML='<div class="replay-header"><span class="eyebrow">THE STORY OF THIS WORLD</span><h3>Every round left a mark.</h3></div><div class="replay-chart"><svg viewBox="0 0 600 100" aria-hidden="true"></svg><div class="replay-rounds">'+moments.map((m,i)=>'<button type="button" data-replay-round="'+i+'" aria-label="Review '+(game==='lantern'?'night ':'round ')+m.num+'" aria-pressed="false">'+(game==='lantern'?'N':'R')+m.num+'</button>').join('')+'</div></div><div class="replay-moment" aria-live="polite"></div>';
    target.prepend(panel);const max=Math.max(...moments.map(m=>m.metric),1),min=Math.min(...moments.map(m=>m.metric),0),points=moments.map((m,i)=>[30+i*540/Math.max(1,moments.length-1),80-(m.metric-min)/(max-min||1)*60]);panel.querySelector('svg').innerHTML='<path class="replay-baseline" d="M30 80h540"/><polyline points="'+points.map(p=>p.join(',')).join(' ')+'"/>'+points.map(([x,y],i)=>'<circle cx="'+x+'" cy="'+y+'" r="4" data-plot-point="'+i+'"/>').join('');
    const select=i=>{const moment=moments[i];panel.querySelectorAll('[data-replay-round]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.replayRound)===i)));panel.querySelectorAll('[data-plot-point]').forEach(p=>p.classList.toggle('selected',Number(p.dataset.plotPoint)===i));panel.querySelector('.replay-moment').innerHTML='<div class="moment-metric"><strong>'+moment.metric+'</strong><span>'+esc(moment.label)+'</span></div><div class="moment-copy"><h4>'+esc(moment.title)+'</h4><p>'+esc(moment.detail)+'</p></div><div class="moment-players">'+E.PEOPLE.map(p=>'<div><span class="moment-avatar" style="background:'+E.personProfile(state,p).color+'">'+A.markup(E.personProfile(state,p),p,state.seedInput)+'</span><span><strong>'+esc(E.personName(state,p))+'</strong><small>'+esc(moment.actions[p])+'</small></span></div>').join('')+'</div>';};panel.querySelectorAll('[data-replay-round]').forEach(b=>b.onclick=()=>select(Number(b.dataset.replayRound)));select(moments.length-1);
    if(state.view==='linger'){const board=document.querySelector('.linger-board');board.style.setProperty('--end-image','url("'+image(game)+'")');board.classList.add('world-finale');}
  }
  function finale(state){
    const card=document.querySelector('.session-card');if(!card||card.dataset.experience)return;card.dataset.experience='true';card.classList.add('session-finale');
    if(card.querySelector('.session-scores')){const label=document.querySelector('.lobby-head .eyebrow');if(label)label.textContent='SESSION RESULTS';}
    const heading=card.querySelector('h2'),lead=heading?.querySelector('strong');
    if(heading&&lead){const title=lead.textContent,description=[...heading.childNodes].filter(n=>n!==lead).map(n=>n.textContent).join(' ').trim();heading.textContent=title;const p=document.createElement('p');p.className='finale-description';p.textContent=description;heading.after(p);}
    const table=document.createElement('div');table.className='finale-table';table.innerHTML=E.PEOPLE.map(p=>'<span><span class="moment-avatar" style="background:'+E.personProfile(state,p).color+'">'+A.markup(E.personProfile(state,p),p,state.seedInput)+'</span><span>'+esc(E.personName(state,p))+'</span></span>').join('');card.prepend(table);
    card.querySelectorAll('.session-score').forEach((tile,i)=>{const game=state.completed[i];if(image(game))tile.insertAdjacentHTML('afterbegin','<img class="session-world-image" src="'+image(game)+'" alt="">');});
  }
  function update(){scheduled=false;const state=UI.getState();if(!state)return;document.body.style.setProperty('--world-accent',colors[state.activeGame]||'#d3f36b');document.body.dataset.experienceView=state.view;
    if(lastView!==state.view){document.body.classList.remove('room-chat-open');if(!['game','punishment'].includes(state.view))setFocus(false);lastView=state.view;}
    mountControls();entrance();journey(state);arrangeBoard(state);recap(state);finale(state);mountWorld();
  }
  const queue=()=>{if(!scheduled){scheduled=true;requestAnimationFrame(update);}};
  new MutationObserver(records=>{if(records.some(r=>r.target.id==='app'||r.target.id==='board'||r.target.classList?.contains('lobby-vote-stack')))queue();}).observe(document.querySelector('#app'),{childList:true,subtree:true});
  const transition=document.querySelector('#transition');if(transition)new MutationObserver(decorateTransition).observe(transition,{childList:true,attributes:true,attributeFilter:['class']});
  update();window.GameTheoryExperience=Object.freeze({refresh:queue});
})();
</script></body>
